# The image's server: dist/ as static files on :8080 (deploy/Dockerfile copies
# this to /etc/nginx/conf.d/default.conf, inside the base image's http {}).
#
# The pod sits behind two proxies (the lab's nginx, and Cloudflare's edge once
# public), so redirects are relative (absolute_redirect off): a directory asked
# for without its trailing slash gets a 301 to "/path/", the same thing Pages
# does with a 308.
#
# Cache policy (the rolling update overlaps old and new pods for seconds, so a
# new page can ask an old pod for a new hashed asset):
#   /_astro/*      hashed by Astro: public, a year, immutable
#   HTML           no-cache (revalidate every time)
#   404s           no-store: a miss during the overlap must never be cached at
#                  Cloudflare's edge, or the asset stays missing for everyone
#   /.release      the deployed commit sha (written by build.yml), no-store
#   other 2xx/301  public, 5 minutes
#   anything else  no-store
# The policy is one add_header at server level fed by the maps below, and no
# location sets a header of its own: a location with any add_header drops every
# server-level one (nginx's inheritance trap), so the security headers would
# vanish from it too. The maps are evaluated when the header is written, after
# error_page's internal redirect, so $status is the final status.
#
# Read-only root filesystem: the base image's nginx.conf already keeps its pid
# and temp paths under /tmp (an emptyDir in deploy/k8s.yaml) and logs to
# stdout/stderr.

map $status $marginem_cache_control {
	200 $marginem_cache_by_uri;
	206 $marginem_cache_by_uri;
	304 $marginem_cache_by_uri;
	301 "public, max-age=300";
	default "no-store";
}

# By URI, not Content-Type: a 304 carries no Content-Type, and it must repeat
# the 200's policy (the browser stores the 304's headers).
map $uri $marginem_cache_by_uri {
	default "public, max-age=300";
	~^/_astro/ "public, max-age=31536000, immutable";
	~(\.html|/)$ "no-cache";
	/.release "no-store";
	/healthz "no-store";
}

server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	absolute_redirect off;
	server_tokens off;
	charset utf-8;

	add_header Cache-Control $marginem_cache_control always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/css text/plain text/xml application/javascript
		application/json application/xml application/rss+xml
		application/atom+xml image/svg+xml;

	error_page 404 /404.html;

	location / {
		try_files $uri $uri/ =404;
	}

	location = /.release {
		default_type text/plain;
	}

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}
}
