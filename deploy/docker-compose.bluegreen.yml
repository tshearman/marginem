x-app-common: &app-common
  image: ${SITE_IMAGE:-blogupdate:latest}
  restart: unless-stopped
  env_file:
    - ./config/deploy.env
    - ./config/secrets.env
  environment:
    HOST: 0.0.0.0
    PORT: ${APP_PORT:-4321}
    LIKES_DB_PATH: /data/likes.db
  networks:
    - web

services:
  app-blue:
    <<: *app-common
    container_name: blogupdate-blue
    volumes:
      - likes-data:/data
      - ${BLUE_BUILD_DIR:-./builds/blue/dist}:/app/dist

  app-green:
    <<: *app-common
    container_name: blogupdate-green
    volumes:
      - likes-data:/data
      - ${GREEN_BUILD_DIR:-./builds/green/dist}:/app/dist

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - app-blue
      - app-green
    ports:
      - "${HOST_PORT:-8080}:80"
    env_file:
      - ./config/deploy.env
      - ./config/secrets.env
    environment:
      ACTIVE_COLOR: ${ACTIVE_COLOR:-blue}
      APP_PORT: ${APP_PORT:-4321}
      PROMOTION_HEALTH_PATH: ${PROMOTION_HEALTH_PATH:-/health}
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: ".template"
      NGINX_ENVSUBST_OUTPUT_DIR: "/etc/nginx/conf.d"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - web

networks:
  web:

volumes:
  likes-data:
